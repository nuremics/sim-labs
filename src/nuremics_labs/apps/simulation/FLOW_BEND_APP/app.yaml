workflow:
  - process: nuremics_labs.apps.simulation.FLOW_BEND_APP.procs.GeometryProc
    user_params:
      r: radius
      R: bend_radius
      L0: inlet_length
      L1: outlet_length
    output_paths:
      outfile: geometry.brep

  - process: nuremics_labs.apps.simulation.FLOW_BEND_APP.procs.LabelingProc
    user_params:
      R: bend_radius
      L0: inlet_length
      L1: outlet_length
    required_paths:
      infile: geometry.brep
    output_paths:
      outfile: labels.json

  - process: nuremics_labs.apps.simulation.FLOW_BEND_APP.procs.MeshProc
    user_params:
      dx: dx
    required_paths:
      infile: labels.json
    output_paths:
      outfile: mesh.msh

  - process: nuremics_labs.apps.simulation.FLOW_BEND_APP.procs.ModelProc
    required_paths:
      infile: mesh.msh
    output_paths:
      outfile: model.vtk

  - process: nuremics_labs.apps.simulation.FLOW_BEND_APP.procs.SolverProc
    user_params:
      r: radius
      R: bend_radius
      u_mean: u_mean
      rho: rho
      mu: mu
      t_final: t_final
      dt: dt
      ramp: ramp
    required_paths:
      mesh_file: mesh.msh
    output_paths:
      outdir: solution

