default_params:
  radius: 2.0
  bend_radius: 5.0
  inlet_length: 20.0
  outlet_length: 10.0
  dx: 0.5
  u_mean: 1.0
  rho: 1.1
  mu: 3.6e-2
  t_final: 50.0
  dt: 0.5
  ramp: 5.0